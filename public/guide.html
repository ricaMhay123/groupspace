<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Guide | GroupSpace</title>
  <meta name="description" content="Complete step-by-step user guide for GroupSpace: Workspaces, 3-Tier Roles, Dual-Approval Kanban Tasks, Word Ribbon Notebook, Smart Expense Settlements, and @/# Mentions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=35.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <a href="/index.html"><h1>GroupSpace</h1></a>
    </div>
    <div class="nav-buttons">
      <button data-theme-toggle aria-label="Toggle theme" title="Toggle theme" class="login-btn" style="padding:8px;display:inline-flex;align-items:center;justify-content:center;">
        <svg data-theme-moon xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
        <svg data-theme-sun xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <a href="/workspaces.html" id="guideHeaderPrimaryCta" class="primary-btn" style="text-decoration:none; padding:8px 16px; font-size:0.85rem; border-radius:8px;">Open Workspaces</a>
    </div>
  </header>

  <main class="ug-page-container">
    <div class="ug-page-hero">
      <div class="ug-page-hero-text">
        <h1>GroupSpace User Guide</h1>
        <p>Learn how to run team workspaces, review tasks with dual-approval gates, author multi-sheet documents in the Word ribbon notebook, simplify group debt settlements, and cross-reference work with <code>@</code> and <code>#</code> mentions.</p>
      </div>
      <div class="ug-search-bar-wrap ug-page-search">
        <svg class="ug-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input
          type="search"
          id="userGuidePageSearchInput"
          class="ug-search-input"
          placeholder="Search any workflow (e.g. #mention, approval, PDF, GCash, grace period)..."
          aria-label="Search User Guide"
          oninput="window.filterUserGuide(this.value)"
        >
      </div>
    </div>

    <div id="userGuidePageTabs" class="ug-tabs-strip ug-page-tabs" role="tablist" aria-label="User Guide Categories"></div>
    <div id="userGuidePageBody" class="ug-page-body"></div>
  </main>

  <script src="/js/guide.js"></script>
  <script>
    (function () {
      const hasToken = !!localStorage.getItem('groupspace_token');
      const cta = document.getElementById('guideHeaderPrimaryCta');
      if (cta && !hasToken) {
        cta.href = '/login.html';
        cta.textContent = 'Sign In';
      }
    })();
  </script>
</body>
</html>
